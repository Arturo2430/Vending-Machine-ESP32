<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAID Vending Machine - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 { color: #00599C; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #00599C;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #003B57; }
        pre { text-align: left; background: #eee; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>
    <h1>Máquina Expendedora SAID</h1>
    <p>¡Si ves esto, el SoftAP y el ESPAsyncWebServer (LittleFS) están funcionando!</p>
    <p><i>Esperando el diseño final de Georgina y Ángel...</i></p>

    <div class="card">
        <h3>Prueba de API (SQLite)</h3>
        <button onclick="testAPI()">Cargar Inventario (/api/slots)</button>
        <pre id="output">{}</pre>
    </div>

    <script>
        function testAPI() {
            document.getElementById('output').innerText = "Cargando...";
            fetch('/api/slots')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('output').innerText = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('output').innerText = "Error: " + error;
                });
        }
    </script>
</body>
</html>
